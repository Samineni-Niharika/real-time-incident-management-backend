spring:
  application:
    name: incidentManagement
  datasource:
    url: jdbc:postgresql://localhost:5432/incident_management
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
        ddl-auto: update
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
        mail:
           smtp:
              auth: true
              starttls:
                enable: true
    
server:
   port: 8080
jwt:
   secret:  ${JWT_SECRET}
   expiration: 86400000
app:
   cors:
      allowed-origins: http://localhost:5173